name: PR Review (OpenCode)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != '' &&
       contains(github.event.comment.body, '/opencode review'))
    name: OpenCode PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/merge', github.event.issue.number) }}

      # ─────────────────────────────────────────────
      # Cache: NPX packages (ClickUp MCP, etc.)
      # ─────────────────────────────────────────────
      - name: Cache NPX packages
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-cache-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npx-cache-${{ runner.os }}-

      # ─────────────────────────────────────────────
      # Pre-flight: validate PR template is filled
      # ─────────────────────────────────────────────
      - name: Validate PR template
        id: validate
        uses: actions/github-script@v9
        with:
          script: |
            const rawBody = context.payload.pull_request?.body || context.payload.issue?.body || '';
            const body = rawBody.replace(/\r\n/g, '\n');
            const stripHtml = (s) => s.replace(/<!--[\s\S]*?-->/g, '');
            const hasHtml = (s) => /<!--[\s\S]*?-->/.test(s);
            const isBlank = (s) => !s.trim();

            const issues = [];

            // ── Story field ──────────────────────────
            const boldStoryMatch = body.match(/\*\*Story:\*\*\s*(.+)/);
            const bodyHasBold = /\*\*Story:\*\*/.test(body);
            const bodyHasPlain = /^Story:\s*\S/m.test(body);

            if (boldStoryMatch) {
              const raw = boldStoryMatch[1].trim();
              if (hasHtml(raw) && isBlank(stripHtml(raw))) {
                issues.push('- **Story:** — Story value is an HTML comment (`<!-- ... -->`).\n  Replace it with your actual story ID, e.g., `**Story:** E4-S02`');
              }
            } else if (bodyHasBold) {
              const idx = body.indexOf('**Story:**');
              const rest = body.slice(idx + 9).trim();
              if (!rest || rest.startsWith('<!--')) {
                issues.push('- **Story:** — Found `**Story:**` but no story ID after it.\n  Write the ID on the same line: `**Story:** E4-S02`');
              }
            } else if (bodyHasPlain) {
              const current = body.match(/^Story:\s*\S+/m)?.[0] || 'Story: <value>';
              issues.push('- **Story:** — Use `**Story:**` instead of `Story:`.\n  Expected: `**Story:** E4-S02`\n  Current: `' + current + '`');
            } else {
              issues.push('- **Story:** — Missing `**Story:**` field entirely.\n  Add it under the `## Story` heading: `**Story:** E4-S02`');
            }

            // ── ClickUp task URL field ──────────────
            const storyValue = boldStoryMatch ? stripHtml(boldStoryMatch[1]).trim() : '';
            const isNaStory = /^(n\/a|none|N\/A|NONE|-)$/i.test(storyValue);

            if (!isNaStory && storyValue) {
              const clickupMatch = body.match(/\*\*ClickUp task:\*\*\s*(\S+)/);
              const clickupValue = clickupMatch ? stripHtml(clickupMatch[1]).trim() : '';
              const isClickupUrl = /https:\/\/app\.clickup\.com\/t\/\d+\/[a-z0-9]+/.test(clickupValue);

              if (!clickupValue || clickupValue.startsWith('<!--')) {
                issues.push('- **ClickUp task:** — Missing or empty.\n  Paste the full ClickUp task URL, e.g., `**ClickUp task:** https://app.clickup.com/t/90161657622/86d3dqmk6`');
              } else if (!isClickupUrl) {
                issues.push('- **ClickUp task:** — Value `' + clickupValue + '` doesn\'t look like a ClickUp task URL.\n  Expected format: `https://app.clickup.com/t/{workspace}/{task_id}`');
              }
            }

            // ── Section diagnostic helper ────────────
            function extractContent(body, heading) {
              const boundaries = [
                '\n## Story', '\n## What changed', '\n## Test evidence', '\n## Checklist',
                '\n---',
                '\nStory:', '\nWhat changed', '\nTest evidence', '\nChecklist'
              ];

              // Try markdown heading first, then plain heading
              let startIdx = body.indexOf('## ' + heading);
              let isMarkdown = true;
              if (startIdx === -1) {
                startIdx = body.indexOf('\n' + heading);
                isMarkdown = false;
                // Also try start-of-string
                if (startIdx === -1 && body.startsWith(heading + '\n')) startIdx = 0;
              }
              if (startIdx === -1) return { content: '', isMarkdown: false };

              const afterHeading = body.slice(startIdx + heading.length + (isMarkdown ? 3 : 0));
              const contentStart = afterHeading.search(/\S/);
              if (contentStart === -1) return { content: '', isMarkdown };
              const after = afterHeading.slice(contentStart);

              let endIdx = after.length;
              for (const b of boundaries) {
                const bi = after.indexOf(b);
                if (bi !== -1 && bi < endIdx) endIdx = bi;
              }

              return { content: after.slice(0, endIdx).trim(), isMarkdown };
            }

            function diagnoseSection(heading, label) {
              const { content: rawContent, isMarkdown } = extractContent(body, heading);
              const hasMarkdown = body.includes('## ' + heading);
              const hasPlain = body.includes('\n' + heading) || body.startsWith(heading + '\n');

              if (!rawContent && !hasMarkdown && !hasPlain) {
                issues.push('- **' + label + '** — Missing `## ' + heading + '` section entirely.\n  Add a `## ' + heading + '` heading with content describing the PR\'s changes.');
              } else if (!rawContent && hasMarkdown) {
                issues.push('- **' + label + '** — `## ' + heading + '` is empty (no content after the heading).\n  Write 2-4 sentences describing the PR\'s changes.');
              } else if (!rawContent && hasPlain) {
                issues.push('- **' + label + '** — `' + heading + '` (plain text) is empty.\n  Use `## ' + heading + '` with 2-4 sentences describing the PR\'s changes.');
              } else if (hasHtml(rawContent) && isBlank(stripHtml(rawContent))) {
                issues.push('- **' + label + '** — `' + (isMarkdown ? '## ' : '') + heading + '` contains only HTML comments (`<!-- ... -->`).\n  Remove the comment markers and write real content.');
              } else if (hasPlain && !hasMarkdown) {
                issues.push('- **' + label + '** — Use `## ' + heading + '` instead of `' + heading + '`.\n  (needs the `## ` markdown heading prefix for CI to recognize it).');
              }
            }

            diagnoseSection('What changed', 'What changed');
            diagnoseSection('Test evidence', 'Test evidence');

            // ── Report ──────────────────────────────
            if (issues.length > 0) {
              const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
              const commentBody = `## ⚠️ PR Review Skipped\n\nThe PR template has issues that must be fixed:\n\n${issues.join('\n\n')}\n\nPlease update the PR description and comment \`/opencode review\` to trigger the review.`;

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body: commentBody,
              });

              core.setOutput('template_valid', 'false');
              core.setFailed('PR template is incomplete - review skipped');
            } else {
              core.setOutput('template_valid', 'true');
            }

      # ─────────────────────────────────────────────
      # Git identity (needed by OpenCode's internal commit)
      # ─────────────────────────────────────────────
      - name: Configure git identity
        run: |
          git config user.name "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"

      # ─────────────────────────────────────────────
      # OpenCode PR review
      # ─────────────────────────────────────────────
      - name: OpenCode PR review
        id: opencode
        if: |
          steps.validate.outputs.template_valid == 'true' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.draft != true &&
            github.event.action != 'edited'))
        timeout-minutes: 10
        uses: anomalyco/opencode/github@latest
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: minimax/MiniMax-M2.7
          use_github_token: true
          share: false
          prompt: |
            You are the Senior Engineer reviewing a PR for the EVIA project.

            ## Context
            - Repo: ${{ github.repository }}
            - PR: #${{ github.event.pull_request.number || github.event.issue.number }}
            - Base branch: ${{ github.base_ref }}

            ## Step 1 — Read the PR

            Read the event payload at $GITHUB_EVENT_PATH using jq.
            Extract: PR body (.pull_request.body or .issue.body), title, author, head branch ref.

            From the body, extract:
            - The ClickUp story ID from the `**Story:**` field (e.g. `E3-S01`)
            - The ClickUp task URL from the `**ClickUp task:**` field (e.g. `https://app.clickup.com/t/90161657622/86d3dqmk6`)
            - Parse the task ID from the URL: it is the last path segment (e.g. `86d3dqmk6`)

            ## Step 2 — Verify conventions

            Check:
            - Branch follows convention: story/E{epic}-S{story}-description
            - PR targets develop (not main), unless it's a hotfix/* branch
            - PR template is filled (Story ID present, What Changed has content, Test Evidence has content)

            ## Step 3 — Fetch the ClickUp story

            If the story ID is "N/A", "none", or clearly not a real story ID, skip this step and note
            that spec comparison is not applicable.

            Otherwise you MUST try ALL of the following attempts in order. Do NOT skip to the review
            without attempting every one.

            **Attempt 1 — MCP get task (use if clickup MCP tools are available):**
            Run `clickup_get_task` with the task ID parsed from the `**ClickUp task:**` URL in Step 1.

            **Attempt 2 — MCP search (use if Attempt 1 failed or no task URL is available):**
            Run `clickup_search` with the story ID text (e.g. "E3-S04").

            **Attempt 3 — curl direct fetch (execute this regardless of whether MCP worked):**
            Parse the task ID from the `**ClickUp task:**` URL (last path segment, e.g. `86d3dqmk6`).
            Run this shell command now:
            ```
            curl -s -H "Authorization: $CLICKUP_API_KEY" \
              "https://api.clickup.com/api/v2/task/TASK_ID_HERE?include_markdown_description=true"
            ```

            **Attempt 4 — curl search (use if no task URL or Attempt 3 returned an error):**
            Run these shell commands now:
            ```
            WSID=$(curl -s -H "Authorization: $CLICKUP_API_KEY" \
              "https://api.clickup.com/api/v2/team" | jq -r '.teams[0].id')
            curl -s -H "Authorization: $CLICKUP_API_KEY" \
              "https://api.clickup.com/api/v2/team/$WSID/task?text=STORY_ID_HERE&include_closed=true&subtasks=true"
            ```

            From whichever attempt returns data, extract:
            - Task name and description
            - Custom fields named "Functional Requirements", "Acceptance Criteria", "AI Coding Notes",
              "Definition of Done"

            Only report "unable to fetch" if all 4 attempts produced errors or empty results.

            ## Step 4 — Read the diff

            Run: git diff origin/${{ github.base_ref }}...HEAD --stat
            Then: git diff origin/${{ github.base_ref }}...HEAD

            Categorize all changed files by app (api, mobile, therapist-portal, worker, shared-types, etc.).

            ## Step 5 — Run the structured review

            Review every changed file against the spec. Structure your analysis:

            ### 5a. Scope check
            - Does the PR do exactly what the story spec describes?
            - Any out-of-scope changes?
            - Any required pieces missing?

            ### 5b. Functional requirements check
            Go through every item from the spec's Functional Requirements.
            For each: ✅ IMPLEMENTED, ❌ MISSING, ⚠️ PARTIAL

            ### 5c. Acceptance criteria check
            Go through every item from the spec's Acceptance Criteria.
            For each: ✅ MET, ❌ NOT MET, ⚠️ CANNOT VERIFY

            ### 5d. AI Coding Notes compliance
            Check Common mistakes, Hidden requirements, Security considerations, Performance considerations.

            ### 5e. Security check (non-negotiable)
            - Hardcoded secrets or .env values?
            - LOCAL_DEV_BYPASS_AUTH hardcoded as true?
            - JWT validation enforced?
            - Self-only authorization present?
            - AES-256-GCM used correctly (E9-S02)?
            - Therapist-to-client scoping server-side (therapist portal)?
            - E11-S03: notes table NOT referenced in agent context code?

            ### 5f. Database check
            - No raw SQL (Prisma only)?
            - Upserts used where idempotency required?
            - Queries filtered to authenticated user?

            ### 5g. TypeScript / code quality check
            - No `any` types (use `unknown`)?
            - No duplicate types from packages/shared-types/?
            - No unused imports/variables?
            - Error handling on all async operations?
            - No console.log in production paths?

            ### 5h. Test evidence check
            - PR template Test Evidence section filled with real output?
            - If DoD includes specific tests, is evidence provided?
            - For E12 stories: do test assertions actually test what they claim?

            ## Step 6 — Produce the verdict

            Format your verdict exactly like this:

            ---
            ## PR Review — E{epic}-S{story}: {story title}
            **PR:** #{number} by {author}
            **Verdict:** APPROVE

            ### Summary
            {2-3 sentence summary}

            ### Functional Requirements
            {checklist from 5b}

            ### Acceptance Criteria
            {checklist from 5c}

            ### AI Coding Notes Compliance
            {checklist from 5d}

            ### Issues Found
            {numbered list with severity, file:line, problem, fix}

            ### Security
            {PASS or list of BLOCK-level findings}

            ### Definition of Done
            {checklist}

            ### Merge Decision
            {APPROVE / REQUEST CHANGES / BLOCK with reasoning}
            ---

            ## Step 7 — Save the review

            Write the entire verdict to /tmp/review.md.

            ## Step 8 — Finish silently

            After writing /tmp/review.md, output ONLY this exact line as your final response and nothing else:
            `Review saved.`

            Do NOT reproduce the review, the verdict, or any summary in your response text.

            Execute all steps now.

      # ─────────────────────────────────────────────
      # Post full review to PR
      # ─────────────────────────────────────────────
      - name: Post review to PR
        if: steps.opencode.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const reviewPath = '/tmp/review.md';
            let body;
            try {
              body = fs.readFileSync(reviewPath, 'utf8');
            } catch {
              core.warning('review.md not found — skipping PR comment');
              return;
            }
            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body,
            });

      # ─────────────────────────────────────────────
      # Discord notification
      # ─────────────────────────────────────────────
      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          PR_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          VALIDATION_RESULT: ${{ steps.validate.outputs.template_valid }}
          REVIEW_OUTCOME: ${{ steps.opencode.outcome || 'skipped' }}
        run: |
          echo "DEBUG: WEBHOOK_LENGTH=${#DISCORD_WEBHOOK}"
          echo "DEBUG: VALIDATION_RESULT=$VALIDATION_RESULT"
          echo "DEBUG: REVIEW_OUTCOME=$REVIEW_OUTCOME"

          if [ "$VALIDATION_RESULT" = "false" ]; then
            COLOR=15548997
            TITLE="⚠️ PR Review Skipped - #$PR_NUMBER"
            DESC='**Template incomplete** - fix and comment /opencode review'
          elif [ "$REVIEW_OUTCOME" = "success" ]; then
            COLOR=5814783
            TITLE="🔍 PR Review Complete - #$PR_NUMBER"
            DESC="**$PR_TITLE**"
          else
            COLOR=15548997
            TITLE="❌ PR Review Failed - #$PR_NUMBER"
            DESC="**$PR_TITLE**"
          fi

          PAYLOAD=$(jq -n --arg title "$TITLE" --arg url "$PR_URL" --arg desc "$DESC" --arg author "$PR_AUTHOR" --argjson color "$COLOR" \
            '{embeds: [{title: $title, url: $url, description: ($desc + "\nAuthor: " + $author), color: $color}]}')

          echo "DEBUG: Sending payload to Discord..."
          curl -sS --fail -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
          echo "DEBUG: Discord notification sent successfully"
