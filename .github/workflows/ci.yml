name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  # Image publishing and the ECS rollout belong to the CodeBuild project
  # evia-beta-build (buildspec.yml) on a push to main. CI holds no AWS
  # credentials, so tests and the deploy pipeline stay separate concerns.
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Backend (Node.js / TypeScript)
  # Configured fully in E0-S01 (Sprint 1, Story 1)
  # ─────────────────────────────────────────────
  backend:
    name: Backend — typecheck + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd apps/api && pnpm prisma generate
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: TypeScript typecheck — api
        run: cd apps/api && pnpm tsc --noEmit

      - name: TypeScript typecheck — worker
        run: cd apps/worker && pnpm tsc --noEmit

      - name: TypeScript typecheck — therapist-portal
        run: cd apps/therapist-portal && pnpm tsc --noEmit

      - name: TypeScript typecheck — test-harness
        run: cd apps/test-harness && pnpm tsc --noEmit

      - name: TypeScript typecheck — shared-types
        run: cd packages/shared-types && pnpm tsc --noEmit

      - name: Vitest — unit tests
        run: cd apps/api && pnpm vitest run

      - name: Vitest — therapist-portal (auth & authorization)
        run: cd apps/therapist-portal && pnpm vitest run
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          NODE_ENV: test
          # Never set LOCAL_DEV_BYPASS_AUTH in CI

  # ─────────────────────────────────────────────
  # Flutter (mobile app)
  # Configured fully in E0-S01 (Sprint 1, Story 1)
  # ─────────────────────────────────────────────
  flutter:
    name: Flutter — analyze + widget tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Flutter widget tests
        working-directory: apps/mobile
        run: flutter test --dart-define=FLAVOR=dev test/widget_test.dart

  # ─────────────────────────────────────────────
  # Security gate — never allow credential leaks
  # ─────────────────────────────────────────────
  security:
    name: Security — credential scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for committed .env files
        run: |
          set -euo pipefail
          # On a push (no base ref) diff against the previous commit instead.
          BASE="origin/${{ github.base_ref }}"
          if [ -z "${{ github.base_ref }}" ]; then BASE="HEAD~1"; fi
          if git diff --name-only "$BASE"...HEAD | grep -E '\.env$|\.env\.' | grep -v '\.env\.example'; then
            echo "ERROR: .env file committed. Remove it and check .gitignore."
            exit 1
          fi

      - name: Check for cloud credential files
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          if [ -z "${{ github.base_ref }}" ]; then BASE="HEAD~1"; fi
          if git diff --name-only "$BASE"...HEAD | grep -E 'credentials(\.json)?$|\.pem$|service-account\.json|keyfile\.json|adminsdk'; then
            echo "ERROR: A cloud credential file is committed."
            echo "These files must NEVER be committed. AWS access uses the OIDC role in the"
            echo "'images' job; runtime secrets live in AWS Secrets Manager. Remove from git history"
            echo "if accidentally added."
            exit 1
          fi

      - name: Check LOCAL_DEV_BYPASS_AUTH is not hardcoded as true
        run: |
          if grep -r 'LOCAL_DEV_BYPASS_AUTH = .*true' apps/api/src/ apps/worker/src/ apps/therapist-portal/src/ apps/test-harness/src/ --exclude-dir=__tests__ 2>/dev/null; then
            echo "ERROR: LOCAL_DEV_BYPASS_AUTH hardcoded as true in production code path."
            echo "This must only be set via .env for local development, never in source code."
            exit 1
          fi
