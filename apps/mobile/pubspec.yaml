name: okuvu
description: Okuvu — AI Mental Wellness Companion
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.9.2
  web_socket_channel: ^3.0.1
  connectivity_plus: ^7.2.0
  url_launcher: ^6.3.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.2.3
  lucide_icons_flutter: ^3.1.20
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
  share_plus: ^13.3.0
  google_sign_in: ^7.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.7.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/okuvu-appicon-1024.png"
  adaptive_icon_background: "#2A0F4E"
  adaptive_icon_foreground: "assets/brand/okuvu-appicon-1024.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

patrol:
  app_name: Okuvu
  test_directory: integration_test
  android:
    package_name: ai.okuvu.app
