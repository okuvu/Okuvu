name: evia
description: Evia — AI Mental Wellness Companion
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  dio: ^5.9.2
  web_socket_channel: ^3.0.1
  connectivity_plus: ^7.2.0
  url_launcher: ^6.3.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.7.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

patrol:
  app_name: Evia
  test_directory: integration_test
  android:
    package_name: ai.evia.app
