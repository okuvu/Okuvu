org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Keep the build inside the RAM of a small build box (7.9 GB host, no swap, other
# processes holding ~3 GB). With -Xmx4G the kernel OOM-killer killed the Gradle daemon
# mid-build ("Gradle build daemon disappeared unexpectedly";
# /sys/fs/cgroup/memory.events oom_kill incremented).
kotlin.daemon.jvmargs=-Xmx768m
# Compile Kotlin inside the Gradle JVM instead of a second 700 MB+ daemon.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
# Disable Kotlin incremental compilation: project lives on D:\ but Flutter plugin
# sources are cached on C:\ (pub cache). Cross-drive relative-path caches
# fail to close ("Could not close incremental caches"), breaking the build.
kotlin.incremental=false
android.useAndroidX=true
# Jetifier rewrites old support-library AARs at build time; every dependency here is
# already AndroidX, so it only costs build RAM/time on a small build box.
android.enableJetifier=false
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
