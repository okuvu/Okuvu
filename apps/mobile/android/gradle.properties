org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
# Disable Kotlin incremental compilation: project lives on D:\ but Flutter plugin
# sources are cached on C:\ (pub cache). Cross-drive relative-path caches
# fail to close ("Could not close incremental caches"), breaking the build.
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
