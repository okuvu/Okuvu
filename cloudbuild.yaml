steps:
  # Build the Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - us-central1-docker.pkg.dev/${PROJECT_ID}/backend/backend
      - '-f'
      - apps/api/Dockerfile
      - .
    id: build

  # Run database migrations via Cloud SQL Proxy
  - name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -euo pipefail

        echo "=== 1. Installing Cloud SQL Proxy ==="
        wget -q "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64" -O /cloud-sql-proxy
        chmod +x /cloud-sql-proxy

        echo "=== 2. Starting proxy to ${_CLOUD_SQL_INSTANCE} ==="
        /cloud-sql-proxy ${_CLOUD_SQL_INSTANCE} --port 5432 &
        PROXY_PID=$$!
        sleep 3
        kill -0 $$PROXY_PID 2>/dev/null || { echo "FATAL: Cloud SQL Proxy failed to start"; exit 1; }
        echo "Proxy running (PID: $$PROXY_PID)"

        echo "=== 3. Installing workspace dependencies ==="
        corepack enable && corepack prepare pnpm@11.8.0 --activate
        pnpm install --frozen-lockfile

        echo "=== 4. Building local connection string ==="
        MIGRATE_URL=$$(node -e "
          const u = new URL(process.env.DATABASE_URL);
          const fresh = new URL('postgresql://localhost:5432/evia');
          fresh.username = u.username;
          fresh.password = u.password;
          console.log(fresh.toString());
        ")
        echo "Proxied database: localhost:5432/evia"

        echo "=== 5. Running Prisma migrations ==="
        cd /workspace/packages/prisma
        DATABASE_URL="$$MIGRATE_URL" npx prisma migrate deploy

        echo "=== 6. Migration complete ==="
        kill $$PROXY_PID 2>/dev/null || true
    secretEnv:
      - DATABASE_URL
    waitFor:
      - build
    id: migrate

  # Push image (only if migration succeeded)
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/${PROJECT_ID}/backend/backend
    waitFor:
      - migrate
    id: push

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL

substitutions:
  _CLOUD_SQL_INSTANCE: evia-500215:asia-south1:evia-db

images:
  - us-central1-docker.pkg.dev/${PROJECT_ID}/backend/backend

options:
  machineType: E2_HIGHCPU_8
